<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SGE | AD Brasil Rorainópolis</title>
<style>
  :root {
    --ink: #17212b; --muted: #5e6973; --paper: #f7f5ef; --surface: #ffffff;
    --line: #d8d6cf; --brand: #0f6159; --gold: #b4862d; --success: #16745d; --error: #a63d35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background-color: var(--paper);
    background-image: linear-gradient(rgba(15,97,89,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(15,97,89,.055) 1px, transparent 1px);
    background-size: 32px 32px;
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
  }
  .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  header, footer { width: min(920px, calc(100% - 40px)); margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; padding: 28px 0 18px; border-bottom: 1px solid var(--line); }
  .mark { width: 46px; height: 46px; display: grid; place-items: center; color: white; background: var(--brand); border: 3px solid var(--surface); outline: 1px solid var(--brand); font-family: Georgia, serif; font-size: 19px; font-weight: 700; }
  .brand strong { display: block; font-family: Georgia, serif; font-size: 18px; color: var(--brand); }
  .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; text-transform: uppercase; }
  main { width: min(920px, calc(100% - 40px)); margin: auto; padding: 44px 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 54px; align-items: center; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
  .status-symbol { width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid currentColor; border-radius: 50%; font-size: 16px; }
  h1 { margin: 20px 0 16px; max-width: 620px; font-family: Georgia, serif; font-size: clamp(34px, 5.5vw, 58px); line-height: 1.06; font-weight: 700; }
  .lead { max-width: 610px; margin: 0; color: var(--muted); font-size: 18px; line-height: 1.65; }
  .next-step { padding: 26px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent, var(--gold)); border-radius: 8px; box-shadow: 0 18px 50px rgba(23,33,43,.08); }
  .next-step h2 { margin: 0 0 18px; font-family: Georgia, serif; font-size: 21px; color: var(--brand); }
  .next-step > p { margin: 0; color: var(--muted); line-height: 1.65; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; }
  li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
  li span { width: 30px; height: 30px; display: grid; place-items: center; color: var(--brand); border: 1px solid #9fc1bc; font-weight: 800; font-size: 12px; }
  li p { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  footer { display: flex; justify-content: space-between; gap: 20px; padding: 18px 0 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  form { margin-top: 30px; display: grid; gap: 16px; max-width: 420px; }
  label { display: grid; gap: 7px; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
  input[type="password"] { width: 100%; padding: 13px 15px; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; outline: none; }
  input[type="password"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,97,89,.15); }
  button { justify-self: start; padding: 13px 30px; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--brand); border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #0c5049; }
  button:disabled { opacity: .55; cursor: wait; }
  .form-error { margin: 0; padding: 12px 15px; font-size: 14px; color: var(--error); background: rgba(166,61,53,.08); border: 1px solid rgba(166,61,53,.35); border-radius: 8px; }
  .hint { margin: 0; font-size: 13px; color: var(--muted); }
  @media (max-width: 720px) {
    header, main, footer { width: min(100% - 32px, 560px); }
    header { padding-top: 20px; }
    main { grid-template-columns: 1fr; gap: 30px; padding: 36px 0; align-content: center; }
    h1 { font-size: 36px; }
    .lead { font-size: 16px; }
    footer { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="mark" aria-hidden="true">AD</div>
    <div class="brand"><strong>AD Brasil Rorainópolis</strong><span>Sistema de Gestão Eclesiástica</span></div>
  </header>
  <main>
    <section id="conteudo" aria-live="polite">
      <div class="status" style="color:var(--gold)"><span class="status-symbol">◆</span>Verificando link</div>
      <h1>Aguarde…</h1>
      <p class="lead">Estamos conferindo seu link de acesso.</p>
    </section>
    <section id="lateral" class="next-step" hidden></section>
  </main>
  <footer><span>SGE • Ambiente seguro</span><span>AD Brasil Rorainópolis</span></footer>
</div>
<script>
"use strict";

const SUPABASE_URL = "https://ptegydkazodwbmjnfwnp.supabase.co";
const SUPABASE_KEY = "sb_publishable_zr3zXJIiM5DpvMZUdvUOVg_ats4dmQy";

const elConteudo = document.getElementById("conteudo");
const elLateral = document.getElementById("lateral");
const params = new URLSearchParams(location.search);
const TOKEN = (params.get("token") || "").trim();
const CPF = (params.get("cpf") || "").trim();

function escapar(v) {
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

async function rpc(nome, corpo) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify(corpo),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Replica exata de sge_db.gerar_hash_senha: pbkdf2_sha256$<sal_hex>$<derivada_hex>
async function hashSenha(senha) {
  const enc = new TextEncoder();
  const salBytes = crypto.getRandomValues(new Uint8Array(16));
  const salHex = [...salBytes].map(b => b.toString(16).padStart(2, "0")).join("");
  const chave = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: enc.encode(salHex), iterations: 310000 },
    chave, 256
  );
  const derivada = [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
  return `pbkdf2_sha256$${salHex}$${derivada}`;
}

function statusTag(texto, cor) {
  return `<div class="status" style="color:${cor}"><span class="status-symbol">◆</span>${texto}</div>`;
}

function lateral(titulo, itens, accent) {
  elLateral.style.setProperty("--accent", accent || "var(--gold)");
  elLateral.innerHTML = `<h2>${titulo}</h2><ol>${itens.map((t, i) => `<li><span>${i + 1}</span><p>${t}</p></li>`).join("")}</ol>`;
  elLateral.hidden = false;
}

function mostrarResultado(sucesso, titulo, mensagem, passos) {
  const cor = sucesso ? "var(--success)" : "var(--error)";
  const simbolo = sucesso ? "✓" : "!";
  const eyebrow = sucesso ? "Tudo certo" : "Não foi possível concluir";
  elConteudo.innerHTML = `
    <div class="status" style="color:${cor}"><span class="status-symbol">${simbolo}</span>${eyebrow}</div>
    <h1>${escapar(titulo)}</h1>
    <p class="lead">${escapar(mensagem)}</p>`;
  document.title = `${titulo} | SGE`;
  if (passos && passos.length) lateral("O que acontece agora", passos, cor);
  else if (!sucesso) {
    elLateral.innerHTML = `<h2>Como prosseguir</h2><p>Confira se o endereço foi aberto por inteiro. Se o prazo terminou, solicite um novo link no aplicativo do SGE ou à administração.</p>`;
    elLateral.hidden = false;
  }
}

function telaConfirmacao(nome) {
  const primeiro = nome ? `, ${escapar(String(nome).split(" ")[0])}` : "";
  elConteudo.innerHTML = `
    ${statusTag("Confirmação de e-mail", "var(--gold)")}
    <h1>Confirme seu e-mail${primeiro}</h1>
    <p class="lead">Você abriu o link de confirmação do seu cadastro no SGE. Clique no botão abaixo para validar seu endereço de e-mail e enviar o cadastro para análise da administração.</p>
    <form id="form-confirma">
      <p class="form-error" id="erro" hidden></p>
      <button type="submit" id="btn">Confirmar meu e-mail</button>
      <p class="hint">A confirmação valida apenas o e-mail — o acesso ao sistema é liberado somente após aprovação da administração.</p>
    </form>`;
  document.title = "Confirme seu e-mail | SGE";
  lateral("O que acontece agora", [
    "A administração analisará os dados do cadastro.",
    "Você receberá por e-mail a decisão e o perfil concedido.",
    "O acesso ao SGE será liberado somente após a aprovação.",
  ]);

  document.getElementById("form-confirma").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("btn");
    const erro = document.getElementById("erro");
    btn.disabled = true; btn.textContent = "Confirmando…"; erro.hidden = true;
    try {
      const r = await rpc("sge_confirmar_cadastro", { p_token: TOKEN });
      if (r.ok) {
        mostrarResultado(true, "E-mail confirmado",
          "Seu e-mail foi confirmado com sucesso. Seu cadastro agora está em análise pela administração da AD Brasil Rorainópolis e você receberá a decisão por e-mail.",
          ["A administração analisará os dados do cadastro.", "Você receberá por e-mail a decisão e o perfil concedido.", "O acesso ao SGE será liberado somente após a aprovação."]);
      } else {
        mostrarResultado(false, "Não foi possível confirmar", r.mensagem || "Este link já foi utilizado ou expirou.");
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = "Confirmar meu e-mail";
      erro.textContent = "Falha de comunicação. Verifique sua internet e tente novamente.";
      erro.hidden = false;
    }
  });
}

function telaSenha(cpf, erroMsg) {
  elConteudo.innerHTML = `
    ${statusTag("Redefinição de senha", "var(--gold)")}
    <h1>Crie sua nova senha</h1>
    <p class="lead">Você está redefinindo a senha do acesso ao SGE para o CPF <strong>${escapar(cpf)}</strong>. Escolha uma senha com pelo menos 6 caracteres.</p>
    <form id="form-senha">
      <p class="form-error" id="erro" ${erroMsg ? "" : "hidden"}>${escapar(erroMsg || "")}</p>
      <label>Nova senha
        <input type="password" id="senha" minlength="6" required autocomplete="new-password" autofocus>
      </label>
      <label>Confirmar nova senha
        <input type="password" id="confirma" minlength="6" required autocomplete="new-password">
      </label>
      <button type="submit" id="btn">Salvar nova senha</button>
      <p class="hint">Este link é válido por 24 horas e só pode ser usado uma vez.</p>
    </form>`;
  document.title = "Crie sua nova senha | SGE";
  lateral("Depois de salvar", [
    "Abra o aplicativo do SGE no seu computador.",
    "Entre com seu CPF e a nova senha criada aqui.",
    "Se não foi você quem pediu, avise a administração.",
  ]);

  document.getElementById("form-senha").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("btn");
    const erro = document.getElementById("erro");
    const senha = document.getElementById("senha").value;
    const confirma = document.getElementById("confirma").value;
    if (senha.length < 6) { erro.textContent = "A senha precisa ter pelo menos 6 caracteres."; erro.hidden = false; return; }
    if (senha !== confirma) { erro.textContent = "As senhas digitadas não são iguais. Confira e tente novamente."; erro.hidden = false; return; }
    btn.disabled = true; btn.textContent = "Salvando…"; erro.hidden = true;
    try {
      const senhaHash = await hashSenha(senha);
      const r = await rpc("sge_redefinir_senha", { p_token: TOKEN, p_cpf: cpf, p_senha_hash: senhaHash });
      if (r.ok) {
        mostrarResultado(true, "Senha redefinida",
          "Sua senha foi alterada com sucesso. Abra o aplicativo do SGE e entre com seu CPF e a nova senha.",
          ["Abra o aplicativo do SGE no seu computador.", "Entre com seu CPF e a nova senha que você acabou de criar.", "Se não reconhece esta alteração, avise a administração imediatamente."]);
      } else {
        mostrarResultado(false, "Não foi possível redefinir", r.mensagem || "Este link já foi utilizado ou expirou.");
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = "Salvar nova senha";
      erro.textContent = "Falha de comunicação. Verifique sua internet e tente novamente.";
      erro.hidden = false;
    }
  });
}

(async function iniciar() {
  if (!TOKEN) {
    mostrarResultado(false, "Link inválido", "O link não contém um token válido. Abra o endereço completo recebido por e-mail.");
    return;
  }
  let status;
  try {
    status = await rpc("sge_link_status", { p_token: TOKEN, p_cpf: CPF });
  } catch (e) {
    mostrarResultado(false, "Falha de comunicação", "Não foi possível verificar o link. Verifique sua internet e tente novamente.");
    return;
  }

  switch (status.situacao) {
    case "cadastro":
      telaConfirmacao(status.nome);
      break;
    case "senha":
      telaSenha(status.cpf || CPF);
      break;
    case "expirado":
      mostrarResultado(false, "Link expirado", "O prazo de 24 horas deste link terminou. Solicite um novo link no aplicativo do SGE ou à administração.");
      break;
    case "utilizado":
      mostrarResultado(false, "Link já utilizado", "Este link de confirmação já foi utilizado. Se seu cadastro ainda aguarda aprovação, acompanhe pelo e-mail ou fale com a administração.");
      break;
    default:
      mostrarResultado(false, "Link inválido", "Este link já foi utilizado, não existe ou expirou. Solicite um novo link no aplicativo do SGE ou à administração.");
  }
})();
</script>
</body>
</html>

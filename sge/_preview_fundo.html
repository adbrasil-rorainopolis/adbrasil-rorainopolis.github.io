<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark-operacional">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia — Movimentos de fundo SGE</title>
<style>
  :root { --linhas-rgb: 245,158,11; }
  [data-theme="dark-operacional"] { --bg: #020617; --txt: #e2e8f0; --card: rgba(15,23,42,.88); --bd: rgba(255,255,255,.12); --linhas-rgb: 245,158,11; }
  [data-theme="sacro-claro"] { --bg: #fafaf9; --txt: #1c1917; --card: rgba(255,255,255,.92); --bd: rgba(0,0,0,.10); --linhas-rgb: 217,119,6; }
  [data-theme="azul-real"] { --bg: #020b1f; --txt: #e0e9fa; --card: rgba(7,23,61,.88); --bd: rgba(140,180,255,.14); --linhas-rgb: 56,189,248; }
  [data-theme="verde-oliva"] { --bg: #11130a; --txt: #e6e8d8; --card: rgba(29,32,18,.88); --bd: rgba(200,205,120,.16); --linhas-rgb: 163,168,50; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif; min-height: 100dvh; overflow-x: hidden; transition: background .35s, color .35s; }
  canvas#fundo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .ui { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 10px; }
  .ui button { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--bd); background: var(--card); color: var(--txt); font-size: 11px; font-weight: 700; cursor: pointer; backdrop-filter: blur(8px); }
  .ui button.on { background: rgb(var(--linhas-rgb)); color: #fff; border-color: transparent; }
  .ui .sep { width: 1px; background: var(--bd); margin: 4px 2px; }
  .card { position: relative; z-index: 5; max-width: 340px; margin: 32dvh auto 0; padding: 26px 22px; border-radius: 24px; background: var(--card); border: 1px solid var(--bd); backdrop-filter: blur(12px); text-align: center; }
  .card h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--linhas-rgb)); }
  .card p { font-size: 11px; opacity: .6; margin-top: 8px; line-height: 1.6; }
  .nome { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; z-index: 10; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: .45; }
</style>
</head>
<body>
<canvas id="fundo"></canvas>
<div class="ui">
  <button data-m="linhas" onclick="escolher('linhas')">Linhas (atual)</button>
  <button data-m="estrelas" onclick="escolher('estrelas')">Estrelas cadentes</button>
  <button data-m="solar" onclick="escolher('solar')">Sistema solar</button>
  <button data-m="malha" onclick="escolher('malha')">Malha</button>
  <span class="sep"></span>
  <button onclick="tema('dark-operacional')">Noturno</button>
  <button onclick="tema('sacro-claro')">Dourado</button>
  <button onclick="tema('azul-real')">Marinho</button>
  <button onclick="tema('verde-oliva')">Oliva</button>
</div>
<div class="card">
  <h1>AD Brasil Rorainópolis</h1>
  <p>Card de exemplo para avaliar a legibilidade do conteúdo sobre cada movimento de fundo.</p>
</div>
<div class="nome" id="nome-modo">Linhas onduladas — movimento atual</div>
<script>
const cv = document.getElementById('fundo'), ctx = cv.getContext('2d');
const DPR = Math.min(devicePixelRatio || 1, 2);
const rgb = () => getComputedStyle(document.documentElement).getPropertyValue('--linhas-rgb').trim() || '245,158,11';
function dim(){ cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
addEventListener('resize', dim); dim();

const NOMES = {
  linhas: 'Linhas onduladas — movimento atual',
  estrelas: 'Estrelas cadentes atravessando a tela',
  solar: 'Sistema solar em órbita — bem sutil',
  malha: 'Malha de pontos conectados — discreta'
};

/* ---------- 1. LINHAS (movimento atual) ---------- */
let tLin = 0;
function desenhaLinhas(){
  const h = cv.height, w = cv.width, c = rgb();
  for (let i = 0; i < 5; i++){
    ctx.beginPath();
    const yB = h * (0.2 + i * 0.16);
    for (let x = 0; x <= w; x += 8 * DPR){
      const y = yB + Math.sin(x * 0.0022 + tLin + i * 0.9) * h * 0.045 + Math.sin(x * 0.0009 - tLin * 0.7 + i) * h * 0.03;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(${c},${0.05 + i * 0.012})`;
    ctx.lineWidth = 1.1 * DPR;
    ctx.stroke();
  }
  tLin += 0.008;
}

/* ---------- 2. ESTRELAS CADENTES ---------- */
const fixas = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: .5 + Math.random(), f: Math.random() * 6.28, v: .5 + Math.random() }));
let cadentes = [], proxCad = 0;
function desenhaEstrelas(ts){
  const h = cv.height, w = cv.width, c = rgb();
  for (const s of fixas){
    const a = .10 + .10 * Math.sin(ts * 0.001 * s.v + s.f);
    ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r * DPR, 0, 6.28);
    ctx.fillStyle = `rgba(${c},${a})`; ctx.fill();
  }
  if (ts > proxCad){
    proxCad = ts + 2600 + Math.random() * 4200;
    const dir = Math.random() < .5 ? 1 : -1;
    cadentes.push({ x: Math.random() * w * .8 + w * .1, y: Math.random() * h * .3, vx: dir * (5 + Math.random() * 3) * DPR, vy: (2.2 + Math.random() * 1.6) * DPR, vida: 1 });
  }
  cadentes = cadentes.filter(e => e.vida > 0);
  for (const e of cadentes){
    const cauda = 16;
    const g = ctx.createLinearGradient(e.x, e.y, e.x - e.vx * cauda, e.y - e.vy * cauda);
    g.addColorStop(0, `rgba(${c},${.55 * e.vida})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.strokeStyle = g; ctx.lineWidth = 1.6 * DPR; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x - e.vx * cauda, e.y - e.vy * cauda); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x, e.y, 1.8 * DPR, 0, 6.28); ctx.fillStyle = `rgba(255,255,255,${.8 * e.vida})`; ctx.fill();
    e.x += e.vx; e.y += e.vy; e.vida -= .012;
  }
}

/* ---------- 3. SISTEMA SOLAR — planetas realistas orbitando o sol ---------- */
/* Órbitas em proporção compactada; período ∝ r^1.5 (Kepler).
   Cada planeta tem cor, tamanho e traços de referência ao real:
   Júpiter com faixas + Mancha Vermelha, Saturno e Urano com anéis,
   Terra com mar + continente, Vênus/Mercúrio/Marte/Netuno em cores próprias. */
const PLANETAS = [
  { cor: '#a8a094', raio: .006,  r: .07,  p: .28, crateras: true },          // Mercúrio — cinza rochoso
  { cor: '#e8cf9f', raio: .010,  r: .095, p: .55, nuvens: true },            // Vênus — creme envolto em nuvens
  { cor: '#4a90d9', raio: .011,  r: .13,  p: 1.0, terra: true, lua: true },  // Terra — azul + continente + Lua
  { cor: '#d4724a', raio: .008,  r: .175, p: 1.5, calota: true },            // Marte — vermelho + calota polar
  { cor: '#d8b48f', raio: .030,  r: .26,  p: 3.4, faixas: true, mancha: true }, // Júpiter — faixado + mancha
  { cor: '#e6d2a0', raio: .024,  r: .335, p: 5.2, anel: { w: 2.2, h: .5, tilt: .42, cor: '218,196,150', cassini: true } }, // Saturno
  { cor: '#7fc9d8', raio: .016,  r: .41,  p: 8.0, anel: { w: 1.6, h: .2, tilt: 1.35, cor: '160,215,225', fino: true } }, // Urano — anel vertical
  { cor: '#4a6fd8', raio: .015,  r: .47,  p: 11.0, tempestade: true },       // Netuno — azul + mancha escura
];
const fases = PLANETAS.map(() => Math.random() * 6.28);
function _esfera(px, py, R, cor){
  /* esfera com iluminação: brilho voltado ao centro (sol), terminador escuro */
  const g = ctx.createRadialGradient(px - R * .45, py - R * .45, R * .08, px, py, R * 1.05);
  g.addColorStop(0, '#fff8e0'); g.addColorStop(.3, cor); g.addColorStop(.75, cor); g.addColorStop(1, '#080604');
  ctx.beginPath(); ctx.arc(px, py, R, 0, 6.28); ctx.fillStyle = g; ctx.fill();
  /* halo fino de atmosfera */
  ctx.beginPath(); ctx.arc(px, py, R * 1.18, 0, 6.28);
  const ga = ctx.createRadialGradient(px, py, R * .8, px, py, R * 1.18);
  ga.addColorStop(0, cor + '00'); ga.addColorStop(1, cor + '33');
  ctx.fillStyle = ga; ctx.fill();
}
function _clipPlaneta(px, py, R){
  ctx.beginPath(); ctx.arc(px, py, R, 0, 6.28); ctx.clip();
}
function _desenhaAnel(px, py, R, anel, alfa){
  const rw = R * anel.w, rh = R * anel.w * anel.h;
  const metade = (ini, fim, al) => {
    ctx.beginPath(); ctx.ellipse(0, 0, rw, rh, 0, ini, fim);
    ctx.strokeStyle = `rgba(${anel.cor},${al})`; ctx.lineWidth = anel.fino ? R * .14 : R * .26; ctx.stroke();
    if (anel.cassini){  // divisão de Cassini — anel interno separado por vão
      ctx.beginPath(); ctx.ellipse(0, 0, rw * .72, rh * .72, 0, ini, fim);
      ctx.strokeStyle = `rgba(${anel.cor},${al * .75})`; ctx.lineWidth = R * .16; ctx.stroke();
    }
  };
  ctx.save(); ctx.translate(px, py); ctx.rotate(anel.tilt);
  metade(Math.PI, 2 * Math.PI, alfa * .45);   // metade de trás
  ctx.restore();
  return () => {                               // metade da frente — depois do planeta
    ctx.save(); ctx.translate(px, py); ctx.rotate(anel.tilt);
    metade(0, Math.PI, alfa);
    ctx.restore();
  };
}
function desenhaSolar(ts){
  const h = cv.height, w = cv.width, c = rgb();
  const cx = w * .5, cy = h * .46;
  const base = Math.min(w, h);

  /* === SOL — disco quente + coroa sutil === */
  const pulso = 1 + Math.sin(ts * .0006) * .05;
  const gs = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * .12 * pulso);
  gs.addColorStop(0, 'rgba(255,214,120,.55)'); gs.addColorStop(.25, `rgba(${c},.16)`); gs.addColorStop(1, `rgba(${c},0)`);
  ctx.beginPath(); ctx.arc(cx, cy, base * .12 * pulso, 0, 6.28); ctx.fillStyle = gs; ctx.fill();
  const gsol = ctx.createRadialGradient(cx - base * .01, cy - base * .01, 0, cx, cy, base * .028);
  gsol.addColorStop(0, '#fff3d0'); gsol.addColorStop(.6, '#ffd873'); gsol.addColorStop(1, '#f0a83c');
  ctx.beginPath(); ctx.arc(cx, cy, base * .028, 0, 6.28); ctx.fillStyle = gsol; ctx.fill();

  /* === ÓRBITAS + PLANETAS (rotação bem lenta — movimento contemplativo) === */
  PLANETAS.forEach((p, i) => {
    const R = base * p.r;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.28);
    ctx.strokeStyle = `rgba(${c},.055)`; ctx.lineWidth = DPR; ctx.stroke();
    const ang = fases[i] + ts * .00028 / Math.pow(p.p, 1.5);
    const px = cx + Math.cos(ang) * R, py = cy + Math.sin(ang) * R;
    const Pr = base * p.raio;

    const anelFrente = p.anel ? _desenhaAnel(px, py, Pr, p.anel, .6) : null;
    _esfera(px, py, Pr, p.cor);

    ctx.save(); _clipPlaneta(px, py, Pr);
    if (p.crateras){  // Mercúrio — pontos de cratera
      [[-.3,-.2,.22],[.25,.3,.16],[.05,-.45,.13]].forEach(([dx,dy,rr]) => {
        ctx.beginPath(); ctx.arc(px + dx * Pr, py + dy * Pr, rr * Pr, 0, 6.28);
        ctx.fillStyle = 'rgba(60,55,50,.5)'; ctx.fill();
      });
    }
    if (p.faixas){  // Júpiter — 5 bandas horizontais
      ['#8f6a4a', '#e8d0b0', '#b08a62', '#f0e0c8', '#a8785a'].forEach((cor, b) => {
        ctx.fillStyle = cor + 'bb';
        ctx.fillRect(px - Pr, py - Pr + b * Pr * .38, Pr * 2, Pr * .2);
      });
    }
    if (p.mancha){  // Grande Mancha Vermelha
      ctx.beginPath(); ctx.ellipse(px + Pr * .35, py + Pr * .4, Pr * .32, Pr * .2, 0, 0, 6.28);
      ctx.fillStyle = 'rgba(201,106,74,.95)'; ctx.fill();
    }
    if (p.terra){   // Terra — 2 continentes + calota polar
      ctx.beginPath(); ctx.ellipse(px - Pr * .2, py - Pr * .1, Pr * .45, Pr * .3, .4, 0, 6.28);
      ctx.fillStyle = 'rgba(111,191,115,.85)'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(px + Pr * .35, py + Pr * .3, Pr * .3, Pr * .2, -.3, 0, 6.28);
      ctx.fill();
      ctx.beginPath(); ctx.ellipse(px, py - Pr * .85, Pr * .5, Pr * .2, 0, 0, 6.28);
      ctx.fillStyle = 'rgba(240,250,255,.8)'; ctx.fill();
    }
    if (p.calota){  // Marte — calota polar branca
      ctx.beginPath(); ctx.ellipse(px, py - Pr * .8, Pr * .45, Pr * .22, 0, 0, 6.28);
      ctx.fillStyle = 'rgba(245,245,240,.85)'; ctx.fill();
    }
    if (p.nuvens){  // Vênus — 2 véus de nuvem
      ctx.beginPath(); ctx.ellipse(px, py - Pr * .25, Pr, Pr * .45, .2, 0, 6.28);
      ctx.fillStyle = 'rgba(255,246,220,.30)'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(px, py + Pr * .35, Pr, Pr * .4, -.15, 0, 6.28);
      ctx.fillStyle = 'rgba(255,246,220,.20)'; ctx.fill();
    }
    if (p.tempestade){  // Netuno — Grande Mancha Escura
      ctx.beginPath(); ctx.ellipse(px - Pr * .15, py - Pr * .1, Pr * .4, Pr * .25, 0, 0, 6.28);
      ctx.fillStyle = 'rgba(20,30,90,.7)'; ctx.fill();
    }
    ctx.restore();
    if (anelFrente) anelFrente();

    if (p.lua){  // Lua orbitando a Terra
      const angLua = ts * .002 + i;
      const lx = px + Math.cos(angLua) * Pr * 2.1, ly = py + Math.sin(angLua) * Pr * 2.1;
      ctx.beginPath(); ctx.arc(lx, ly, Pr * .3, 0, 6.28);
      ctx.fillStyle = 'rgba(200,200,195,.85)'; ctx.fill();
    }
  });
}

/* ---------- 4. MALHA — pontos conectados por linhas finas, discreta ---------- */
const nos = Array.from({ length: 34 }, () => ({
  x: Math.random(), y: Math.random(),
  vx: (Math.random() - .5) * .00012, vy: (Math.random() - .5) * .00012,
  r: .8 + Math.random() * 1.4,
}));
function desenhaMalha(){
  const h = cv.height, w = cv.width, c = rgb();
  const lim = .13;
  for (const n of nos){
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > 1) n.vx *= -1;
    if (n.y < 0 || n.y > 1) n.vy *= -1;
  }
  for (let i = 0; i < nos.length; i++){
    for (let j = i + 1; j < nos.length; j++){
      const dx = (nos[i].x - nos[j].x) * w / h, dy = nos[i].y - nos[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < lim){
        ctx.beginPath(); ctx.moveTo(nos[i].x * w, nos[i].y * h); ctx.lineTo(nos[j].x * w, nos[j].y * h);
        ctx.strokeStyle = `rgba(${c},${(1 - d / lim) * .07})`; ctx.lineWidth = DPR; ctx.stroke();
      }
    }
    ctx.beginPath(); ctx.arc(nos[i].x * w, nos[i].y * h, nos[i].r * DPR, 0, 6.28);
    ctx.fillStyle = `rgba(${c},.12)`; ctx.fill();
  }
}

/* ---------- motor ---------- */
let modo = 'linhas';
const DRAW = { linhas: desenhaLinhas, estrelas: desenhaEstrelas, solar: desenhaSolar, malha: desenhaMalha };
function loop(ts){
  ctx.clearRect(0, 0, cv.width, cv.height);
  DRAW[modo](ts);
  requestAnimationFrame(loop);
}
function escolher(m){
  modo = m;
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.getElementById('nome-modo').textContent = NOMES[m];
}
function tema(t){ document.documentElement.setAttribute('data-theme', t); }
escolher('linhas');
requestAnimationFrame(loop);
</script>
</body>
</html>
